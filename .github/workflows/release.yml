name: Native Release

run-name: Native ${{ inputs.release_channel }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string
      pack_sha256:
        description: SHA-256 of history-step-pack-v1.tar.gz
        required: true
        type: string
      v2_pack_sha256:
        description: SHA-256 of history-step-pack-v2.tar.gz (matrices, pins and verification keys)
        required: true
        type: string
      release_channel:
        description: Final GitHub release channel
        required: true
        type: choice
        options:
          - prerelease
          - stable
      platform_ci_run_id:
        description: Successful Platform CI run for the tagged commit
        required: true
        type: string
      replace_existing:
        description: Replace an already published release only after every native build is ready
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}
  PACK_SHA256: ${{ inputs.pack_sha256 }}
  V2_PACK_SHA256: ${{ inputs.v2_pack_sha256 }}
  RELEASE_CHANNEL: ${{ inputs.release_channel }}
  PLATFORM_CI_RUN_ID: ${{ inputs.platform_ci_run_id }}
  REPLACE_EXISTING: ${{ inputs.replace_existing }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Validate tag, version, and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$PACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$V2_PACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_CHANNEL" == prerelease || "$RELEASE_CHANNEL" == stable ]]
          [[ "$REPLACE_EXISTING" == true || "$REPLACE_EXISTING" == false ]]
          version_without_build="${RELEASE_TAG%%+*}"
          if [[ "$RELEASE_CHANNEL" == stable && "$version_without_build" == *-* ]]; then
            echo "stable releases cannot use a semantic prerelease version" >&2
            exit 1
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          tagged_sha="$(git rev-parse "$RELEASE_TAG^{}")"
          test "$(git rev-parse HEAD)" = "$tagged_sha"
          test "$GITHUB_SHA" = "$tagged_sha"
          source scripts/release_common.sh
          release_workspace_version
          test "v$RELEASE_VERSION" = "$RELEASE_TAG"
          test -s ".github/release-notes/$RELEASE_TAG.md"
          release_state="$(gh release view "$RELEASE_TAG" \
            --json assets,isDraft,isPrerelease,name,tagName)"
          if [[ "$REPLACE_EXISTING" == true ]]; then
            if [[ "$(jq -r .isDraft <<<"$release_state")" == false ]]; then
              if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
                test "$(jq -r .isPrerelease <<<"$release_state")" = true
              else
                test "$(jq -r .isPrerelease <<<"$release_state")" = false
              fi
            fi
          else
            test "$(jq -r .isDraft <<<"$release_state")" = true
          fi
          test "$(jq -r .tagName <<<"$release_state")" = "$RELEASE_TAG"
          expected_title="$(sed -n '1s/^# //p' \
            ".github/release-notes/$RELEASE_TAG.md")"
          test -n "$expected_title"
          test "$(jq -r .name <<<"$release_state")" = "$expected_title"
          allowed_assets=(
            history-step-pack-v1.tar.gz
            history-step-pack-v2.tar.gz
            "parano1d-core-$RELEASE_TAG-linux-x86_64.tar.gz"
            "parano1d-core-$RELEASE_TAG-linux-aarch64.tar.gz"
            "parano1d-core-$RELEASE_TAG-windows-x86_64.zip"
            "parano1d-core-$RELEASE_TAG-macos-aarch64.tar.gz"
            "parano1d-core-$RELEASE_TAG-macos-x86_64.tar.gz"
            "parano1d-gui-$RELEASE_TAG-linux-x86_64.deb"
            "parano1d-gui-$RELEASE_TAG-linux-aarch64.deb"
            "parano1d-gui-$RELEASE_TAG-windows-x86_64-setup.exe"
            "parano1d-gui-$RELEASE_TAG-macos-aarch64.dmg"
            "parano1d-gui-$RELEASE_TAG-macos-x86_64.dmg"
            SHA256SUMS
          )
          while IFS= read -r asset; do
            known=false
            for allowed in "${allowed_assets[@]}"; do
              if [[ "$asset" == "$allowed" ]]; then
                known=true
                break
              fi
            done
            [[ "$known" == true ]] || {
              echo "unexpected draft asset: $asset" >&2
              exit 1
            }
          done < <(jq -r '.assets[].name' <<<"$release_state")
          for pack in history-step-pack-v1.tar.gz history-step-pack-v2.tar.gz; do
            test "$(jq --arg pack "$pack" '[.assets[] | select(.name == $pack)] | length' <<<"$release_state")" = 1
          done
          platform_ci="$(gh run view "$PLATFORM_CI_RUN_ID" \
            --json conclusion,event,headSha,status,workflowName)"
          test "$(jq -r .status <<<"$platform_ci")" = completed
          test "$(jq -r .conclusion <<<"$platform_ci")" = success
          test "$(jq -r .event <<<"$platform_ci")" = workflow_dispatch
          test "$(jq -r .workflowName <<<"$platform_ci")" = "Platform CI"
          test "$(jq -r .headSha <<<"$platform_ci")" = "$tagged_sha"

      - name: Verify both frozen packs before allocating native runners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir pack-preflight
          gh release download "$RELEASE_TAG" \
            --pattern history-step-pack-v1.tar.gz \
            --pattern history-step-pack-v2.tar.gz \
            --dir pack-preflight
          python scripts/release_material.py extract --kind v1 \
            --archive pack-preflight/history-step-pack-v1.tar.gz \
            --sha256 "$PACK_SHA256" --output pack-preflight/verified
          python scripts/release_material.py extract --kind v2 \
            --archive pack-preflight/history-step-pack-v2.tar.gz \
            --sha256 "$V2_PACK_SHA256" --output pack-preflight/verified

      - name: Stage the verified frozen packs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-matrix-packs
          path: pack-preflight/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: ${{ matrix.name }}
    needs: preflight
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            id: linux-x86_64
            runner: ubuntu-22.04
            artifact: parano1d-core-${{ inputs.tag }}-linux-x86_64.tar.gz
            gui_artifact: parano1d-gui-${{ inputs.tag }}-linux-x86_64.deb
          - name: Linux ARM64
            id: linux-aarch64
            runner: ubuntu-22.04-arm
            artifact: parano1d-core-${{ inputs.tag }}-linux-aarch64.tar.gz
            gui_artifact: parano1d-gui-${{ inputs.tag }}-linux-aarch64.deb
          - name: Windows x86-64
            id: windows-x86_64
            runner: windows-2025
            artifact: parano1d-core-${{ inputs.tag }}-windows-x86_64.zip
            gui_artifact: parano1d-gui-${{ inputs.tag }}-windows-x86_64-setup.exe
          - name: macOS Apple Silicon
            id: macos-aarch64
            runner: macos-15
            artifact: parano1d-core-${{ inputs.tag }}-macos-aarch64.tar.gz
            gui_artifact: parano1d-gui-${{ inputs.tag }}-macos-aarch64.dmg
          - name: macOS Intel
            id: macos-x86_64
            runner: macos-15-intel
            artifact: parano1d-core-${{ inputs.tag }}-macos-x86_64.tar.gz
            gui_artifact: parano1d-gui-${{ inputs.tag }}-macos-x86_64.dmg

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      ARTIFACT_NAME: ${{ matrix.artifact }}
      GUI_ARTIFACT_NAME: ${{ matrix.gui_artifact }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y appstream clang libclang-dev cmake dpkg-dev pkg-config

      - name: Install pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --yes --no-progress

      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          libclang_path="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$libclang_path/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangPath = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "libclang.dll was not found in $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Download the verified frozen packs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: canonical-matrix-packs
          path: .release-ci/download

      - name: Unpack both preflight-approved packs
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/release_material.py extract --kind v1 \
            --archive .release-ci/download/history-step-pack-v1.tar.gz \
            --sha256 "$PACK_SHA256" --output .release-ci/pack
          python scripts/release_material.py extract --kind v2 \
            --archive .release-ci/download/history-step-pack-v2.tar.gz \
            --sha256 "$V2_PACK_SHA256" --output .release-ci/pack

      - name: Build transition bundle with both matrix generations
        shell: bash
        run: |
          bash ./scripts/build_release.sh \
            --pack .release-ci/pack/history-step-pack-v1 \
            --v2-pack .release-ci/pack/history-step-pack-v2 \
            --v2-pins .release-ci/pack/history-step-pack-v2/pins.env \
            --retirement-keys .release-ci/pack/history-step-pack-v2/retirement-keys \
            --output .release-ci/build
          test -s ".release-ci/build/$ARTIFACT_NAME"
          test -s ".release-ci/build/$GUI_ARTIFACT_NAME"

      - name: Stage verified native deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.id }}
          path: |
            .release-ci/build/${{ matrix.artifact }}
            .release-ci/build/${{ matrix.gui_artifact }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Keep native build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            .release-ci/build/build.log
            target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified release
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download all verified native deliverables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - name: Verify the complete staged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for asset in \
            "parano1d-core-$RELEASE_TAG-linux-x86_64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-linux-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-windows-x86_64.zip" \
            "parano1d-core-$RELEASE_TAG-macos-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-macos-x86_64.tar.gz" \
            "parano1d-gui-$RELEASE_TAG-linux-x86_64.deb" \
            "parano1d-gui-$RELEASE_TAG-linux-aarch64.deb" \
            "parano1d-gui-$RELEASE_TAG-windows-x86_64-setup.exe" \
            "parano1d-gui-$RELEASE_TAG-macos-aarch64.dmg" \
            "parano1d-gui-$RELEASE_TAG-macos-x86_64.dmg"
          do
            test -s "release-assets/$asset"
          done
          mapfile -t staged_assets < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n'
          )
          test "${#staged_assets[@]}" = 10
          gh release download "$RELEASE_TAG" \
            --pattern history-step-pack-v1.tar.gz \
            --pattern history-step-pack-v2.tar.gz \
            --dir release-assets
          actual="$(sha256sum release-assets/history-step-pack-v1.tar.gz | sed 's/[[:space:]].*$//')"
          test "$actual" = "$PACK_SHA256"
          actual="$(sha256sum release-assets/history-step-pack-v2.tar.gz | sed 's/[[:space:]].*$//')"
          test "$actual" = "$V2_PACK_SHA256"

      - name: Publish checksums and open the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd release-assets
          sha256sum \
            "parano1d-core-$RELEASE_TAG-linux-x86_64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-linux-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-windows-x86_64.zip" \
            "parano1d-core-$RELEASE_TAG-macos-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-macos-x86_64.tar.gz" \
            "parano1d-gui-$RELEASE_TAG-linux-x86_64.deb" \
            "parano1d-gui-$RELEASE_TAG-linux-aarch64.deb" \
            "parano1d-gui-$RELEASE_TAG-windows-x86_64-setup.exe" \
            "parano1d-gui-$RELEASE_TAG-macos-aarch64.dmg" \
            "parano1d-gui-$RELEASE_TAG-macos-x86_64.dmg" \
            history-step-pack-v1.tar.gz \
            history-step-pack-v2.tar.gz \
            > SHA256SUMS
          # A replacement release remains fully available while all platform
          # jobs run. Hide it only for the final, fail-closed asset switch so
          # users can never download a mixture of old binaries and new sums.
          gh release edit "$RELEASE_TAG" --draft=true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" \
            "parano1d-core-$RELEASE_TAG-linux-x86_64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-linux-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-windows-x86_64.zip" \
            "parano1d-core-$RELEASE_TAG-macos-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-macos-x86_64.tar.gz" \
            "parano1d-gui-$RELEASE_TAG-linux-x86_64.deb" \
            "parano1d-gui-$RELEASE_TAG-linux-aarch64.deb" \
            "parano1d-gui-$RELEASE_TAG-windows-x86_64-setup.exe" \
            "parano1d-gui-$RELEASE_TAG-macos-aarch64.dmg" \
            "parano1d-gui-$RELEASE_TAG-macos-x86_64.dmg" \
            SHA256SUMS \
            --clobber
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
          release_state="$(gh release view "$RELEASE_TAG" \
            --json assets,isDraft,isPrerelease,tagName)"
          test "$(jq -r .isDraft <<<"$release_state")" = false
          test "$(jq -r .tagName <<<"$release_state")" = "$RELEASE_TAG"
          test "$(jq '.assets | length' <<<"$release_state")" = 13
          for asset in \
            "parano1d-core-$RELEASE_TAG-linux-x86_64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-linux-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-windows-x86_64.zip" \
            "parano1d-core-$RELEASE_TAG-macos-aarch64.tar.gz" \
            "parano1d-core-$RELEASE_TAG-macos-x86_64.tar.gz" \
            "parano1d-gui-$RELEASE_TAG-linux-x86_64.deb" \
            "parano1d-gui-$RELEASE_TAG-linux-aarch64.deb" \
            "parano1d-gui-$RELEASE_TAG-windows-x86_64-setup.exe" \
            "parano1d-gui-$RELEASE_TAG-macos-aarch64.dmg" \
            "parano1d-gui-$RELEASE_TAG-macos-x86_64.dmg" \
            history-step-pack-v1.tar.gz \
            history-step-pack-v2.tar.gz \
            SHA256SUMS
          do
            jq -e --arg asset "$asset" \
              '.assets | any(.name == $asset)' <<<"$release_state" >/dev/null
          done
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            test "$(jq -r .isPrerelease <<<"$release_state")" = true
          else
            test "$(jq -r .isPrerelease <<<"$release_state")" = false
          fi
