[workspace]
members = [
    "bench_prover",
    "noid_core",
    "noid_fri",
    "noid_fri_binius",
    "noid_poseidon2b",
    "noid_ivc_core",
    "noid_ivc_prover",
    "noid_tx",
    "noid_chain",
    "noid_gkr",
    "noid_block",
    "noid_recursive",
    "noid_soundness",
    # Node Infrastructure
    "noid_mempool",
    "noid_miner",
    "noid_p2p",
    "noid_rpc",
    "noid_node",
    "noid_gui",
    # External tools
    "noid_extminer",
]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
