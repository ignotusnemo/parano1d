[package]
name        = "noid-extminer"
version     = "0.0.1"
edition     = "2021"
license     = "Apache-2.0"
description = "External Poseidon2b PoW miner for the Paranoid blockchain"
default-run = "noid-extminer"

[[bin]]
name = "noid-extminer"
path = "src/main.rs"

[dependencies]
# PoW hashing
noid_core      = { path = "../noid_core" }
noid_poseidon2b = { path = "../noid_poseidon2b" }
rayon      = "1"

# HTTP / JSON-RPC
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
hex    = "0.4"
anyhow = "1"
