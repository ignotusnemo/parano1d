[package]
name = "noid_gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Parano1d wallet application"

[features]
default = []
# Temporary local-network bootstrap surface. Build explicitly with
# `--features dev-genesis`; remove this feature before the public GUI merge.
dev-genesis = []

[[bin]]
name = "parano1d-gui"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = [
    "advanced-shaping",
    "canvas",
    "fira-sans",
    "image-without-codecs",
    "qr_code",
    "tokio",
] }
blake3 = "1"
hex = "0.4"
libmdbx = "0.6"
noid_tx = { path = "../noid_tx" }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.33"
tokio = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
