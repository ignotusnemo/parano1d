[package]
name = "noid_rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noid_chain      = { path = "../noid_chain" }
noid_tx         = { path = "../noid_tx" }
noid_poseidon2b = { path = "../noid_poseidon2b" }
noid_mempool    = { path = "../noid_mempool" }
noid_miner      = { path = "../noid_miner" }
noid_p2p        = { path = "../noid_p2p" }
noid_recursive  = { path = "../noid_recursive" }
jsonrpsee    = { version = "0.24", features = ["server", "macros"] }
tower        = { version = "0.4", features = ["util"] }
http         = "1"
blake3       = "1"
subtle       = "2"
zeroize      = "1"
tokio        = { workspace = true }
tracing      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }

hex          = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
