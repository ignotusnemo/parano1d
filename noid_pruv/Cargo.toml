[package]
name = "noid_pruv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pruv compiler for Parano1d native contracts"

[[bin]]
name = "pruv"
path = "src/main.rs"

[dependencies]
noid_tx = { path = "../noid_tx" }
noid_poseidon2b = { path = "../noid_poseidon2b" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
